name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check --select E4,E7,E9,F win_ir_triage/ tests/ examples/

      - name: Every bundled rule loads (none silently skipped)
        run: |
          python - <<'PY'
          import sys
          from win_ir_triage.sigma import load_rules_dir
          errors = []
          rules = load_rules_dir("rules", on_error=lambda p, e: errors.append(f"{p.name}: {e}"))
          if errors:
              sys.exit("rule errors:\n" + "\n".join(errors))
          print(f"{len(rules)} rules OK")
          PY

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  real-data:
    name: Real EVTX samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Fetch the public EVTX-ATTACK-SAMPLES dataset (GPL, not bundled)
        run: git clone --depth 1 https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES /tmp/evtx-samples
      - name: Parse every sample, run all rules, check the labelled samples
        run: python tools/validate_attack_samples.py /tmp/evtx-samples
