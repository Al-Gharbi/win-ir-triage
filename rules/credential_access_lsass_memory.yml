title: Suspicious LSASS Process Access (Potential Credential Dumping)
id: wit-004
status: stable
description: >
  Detects a process opening a handle to lsass.exe with a broad access
  mask (full/near-full rights). LSASS holds cached credential material in
  memory; tools such as Mimikatz, comsvcs.dll MiniDump abuse, and many
  post-exploitation frameworks request one of these high-privilege access
  levels when dumping credentials. Some EDR/AV agents also legitimately
  request broad access to lsass.exe, so tune the `filter` block below to
  your own known-good security products before enabling in production.
author: win-ir-triage
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
  definition: Sysmon Event ID 10
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
      - '0x1f1fff'
      - '0x1f0fff'
      - '0x1f2fff'
  filter:
    SourceImage|contains:
      - '\MsMpEng.exe'
      - '\Windows Defender\\'
  condition: selection and not filter
level: high
