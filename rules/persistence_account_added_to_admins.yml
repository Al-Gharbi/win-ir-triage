title: Member Added to Local Administrators Group
id: wit-001
status: stable
description: >
  Detects a security principal being added to the built-in local
  Administrators group (well-known SID S-1-5-32-544). Legitimate on
  freshly provisioned machines or during planned admin onboarding, but a
  very common persistence / privilege-escalation step for an attacker who
  has obtained a foothold and wants a durable, high-privilege account.
author: win-ir-triage
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://attack.mitre.org/techniques/T1136/001/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - attack.t1136.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4732
    TargetSid: 'S-1-5-32-544'
  condition: selection
level: high
