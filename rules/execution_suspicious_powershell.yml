title: Suspicious Encoded or Hidden-Window PowerShell Execution
id: wit-005
status: stable
description: >
  Detects PowerShell launched with a Base64 encoded command
  (-e / -ec / -enc / -EncodedCommand followed by a long Base64 blob), or
  with a hidden window combined with -NoProfile or an execution-policy
  bypass. Each flag on its own is common in legitimate administration
  (for example -NoProfile alone is in countless scheduled tasks), so a
  single flag no longer fires the rule. Expect some hits from deployment
  and management tooling that uses -EncodedCommand; tune with a filter
  block for your environment.
author: win-ir-triage
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
  definition: Sysmon Event ID 1 (Image) or Security Event ID 4688 with command-line auditing (NewProcessName)
detection:
  selection_image:
    - EventID: 1
      Image|endswith:
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
    - EventID: 4688
      NewProcessName|endswith:
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
  encoded:
    CommandLine|re: '\s-e[a-z]*\s+[A-Za-z0-9+/=]{16,}'
  hidden:
    CommandLine|re: '\s-w(?:in(?:dowstyle)?)?\s+hidden'
  noprofile:
    CommandLine|re: '\s-nop(?:rofile)?(?:\s|$)'
  bypass:
    CommandLine|re: '\s-(?:ep|exec(?:utionpolicy)?)\s+bypass'
  condition: selection_image and (encoded or (hidden and (noprofile or bypass)))
level: high
